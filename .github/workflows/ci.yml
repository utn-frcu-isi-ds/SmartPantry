name: CI

on:
  pull_request:
    branches: [main, stg, prod]
  push:
    branches: [main, stg, prod]

jobs:
  repository-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required repository files
        shell: bash
        run: |
          required_files=(
            README.md
            CONTRIBUTING.md
            CONFIGURACION_INICIAL.md
            .gitignore
            .github/CODEOWNERS
            .github/PULL_REQUEST_TEMPLATE.md
            .github/ISSUE_TEMPLATE/feature.yml
            .github/workflows/ci.yml
          )
          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "::error file=$file::Required file is missing"; exit 1; }
          done
      - name: Verify mandatory placeholders
        shell: bash
        run: |
          if grep -En '<(organizacion|repositorio|Nombre del proyecto|Nombre y usuario GitHub)>' README.md CONTRIBUTING.md .github/CODEOWNERS; then
            echo "::error::Mandatory placeholders have not been replaced"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ./SmartPantry.slnx
      - run: dotnet build ./SmartPantry.slnx --configuration Release --no-restore
      - run: dotnet test ./SmartPantry.slnx --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn test --watch=false --browsers=ChromeHeadless
